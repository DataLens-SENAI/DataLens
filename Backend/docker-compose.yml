# Ambiente completo: banco, serviço Python e API Java (lê as variáveis do .env)
#   só o banco (rodando a API pela IDE): docker compose up -d postgres
#   tudo:                                docker compose up -d --build
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - dados-postgres:/var/lib/postgresql/data

  # serviço Python: só a API acessa, por isso não expõe porta para fora
  processamento:
    build: ../Processamento

  api:
    build: .
    env_file: .env
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      PROCESSAMENTO_URL: http://processamento:8000
    ports:
      - "8080:8080"
    depends_on:
      - postgres
      - processamento

volumes:
  dados-postgres:
