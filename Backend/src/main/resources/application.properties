spring.application.name=datalens

# Conexão com o PostgreSQL: valores vêm das variáveis de ambiente (ver .env.example)
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:datalens}
spring.datasource.username=${DB_USER:datalens}
spring.datasource.password=${DB_PASSWORD}

# O schema é criado só pelo Flyway; o Hibernate apenas confere se as entidades batem com as tabelas
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Limite de tamanho do upload (igual ao do front)
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# Erros da API não expõem stack trace
server.error.include-stacktrace=never
